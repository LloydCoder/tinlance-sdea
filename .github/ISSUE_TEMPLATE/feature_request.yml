name: Feature request
description: Propose a focused improvement that fits SDEA's architecture.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior, contract or workflow you propose.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Architecture fit
      description: Which SDEA responsibility does this belong to? Identify boundary or ADR implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
    validations:
      required: false
